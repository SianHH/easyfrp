name: BuildEasyFrp

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  easyfrps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          repository: 'sian/easyfrp'
          github-server-url: 'https://git.xsian.top'
          ref: 'master' 
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Extract Tag
        id: extract_tag
        run: |
          TAG_NAME=$(echo ${{ github.ref }} | sed 's/refs\/tags\/v//')
          echo "DOCKER_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --timeout 300m --parallelism=4
          workdir: ./easyfrps

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./easyfrps/dist/*.tar.gz
            ./easyfrps/dist/*.zip

      - name: Docker buildx
        run: |
          cd easyfrps
          docker buildx create --name easyfrps-builder --use
          docker buildx build --platform linux/amd64,linux/arm64 -t sianhh/easyfrps:latest -t sianhh/easyfrps:${{ env.DOCKER_TAG }} --push .
          docker buildx rm easyfrps-builder

      - name: Copy tar.gz files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "easyfrps/dist/*.tar.gz"
          target: "/mnt/files/direct/easyfrp"
          strip_components: 2

      - name: Copy zip files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "easyfrps/dist/*.zip"
          target: "/mnt/files/direct/easyfrp"
          strip_components: 2

